name: CI
on:
  - push
  - pull_request
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: extractions/setup-just@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - run: just setup
      - run: just check
